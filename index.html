<head>
  <title>EaglercraftX</title>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
    #game_frame { width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; background-color: #000; }
  </style>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/gh/bubbls/loltheygotbannedfromjsdelivr@38f40924ae70b843f3d4d0a5dc3d6ba13ca3a461/classes.min.js"></script>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/gh/bubbls/loltheygotbannedfromjsdelivr@38f40924ae70b843f3d4d0a5dc3d6ba13ca3a461/fix-webm-duration.js"></script>
  <script type="text/javascript">
    const SUPABASE_URL = "https://uwpcgccammspgzocjsco.supabase.co";
    const SUPABASE_KEY = "sb_publishable_VovyqA7vY-IVd2qke-sCRg_l1LdpMMV";

    // Reads /party=ekw, /server=zentic.cc, ?party=ekw or ?server=zentic.cc
    function getParams() {
      const out = {};
      const path = decodeURIComponent(location.pathname.replace(/^\/+|\/+$/g, ""));
      const m = path.match(/^(party|server)=(.+)$/i);
      if (m) out[m[1].toLowerCase()] = m[2];
      const q = new URLSearchParams(location.search);
      for (const k of ["party", "server"]) if (q.get(k)) out[k] = q.get(k);
      return out;
    }

    function toWsAddr(input) {
      let s = String(input).trim();
      if (!/^wss?:\/\//i.test(s)) s = "wss://" + s;
      try {
        const u = new URL(s);
        return /^wss?:$/.test(u.protocol) ? u.href : null;
      } catch { return null; }
    }

    async function lookupParty(code) {
      if (!/^[A-Za-z0-9_-]{1,32}$/.test(code)) return null;
      const res = await fetch(
        `${SUPABASE_URL}/rest/v1/parties?code=eq.${encodeURIComponent(code)}&select=server,name`,
        { headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` } }
      );
      if (!res.ok) return null;
      const rows = await res.json();
      return rows[0] || null;
    }

    window.addEventListener("load", async function () {
      window.focus();
      document.body.addEventListener("click", () => window.focus(), false);

      if (location.protocol === "file:") {
        console.warn("HTTP required. Do not open this file locally, run it via a local HTTP server.");
        return;
      }

      const opts = {
        container: "game_frame",
        assetsURI: "https://cdn.jsdelivr.net/gh/bubbls/loltheygotbannedfromjsdelivr@38f40924ae70b843f3d4d0a5dc3d6ba13ca3a461/assets.epk",
        localesURI: "/lang/",
        servers: [
          { addr: "wss://mc.arch.lol/", name: "ArchMC" },
          { addr: "wss://mc.asspixel.net", name: "AssPixel" },
          { addr: "wss://sus.shhnowisnottheti.me", name: "Ayunboom" },
          { addr: "wss://aeon-network.net/1.8", name: "Aeon" },
          { addr: "wss://zentic.org/", name: "Zentic" }
        ]
      };

      const params = getParams();
      let target = null, label = null;
      try {
        if (params.party) {
          const row = await lookupParty(params.party);
          if (row) { target = toWsAddr(row.server); label = row.name || "Party " + params.party; }
          else console.warn("Party not found:", params.party);
        } else if (params.server) {
          target = toWsAddr(params.server);
          label = params.server;
        }
      } catch (e) { console.error("Param lookup failed:", e); }

      if (target) {
        opts.servers.unshift({ addr: target, name: label });
        opts.joinServer = target; // auto-connect (needs a build that supports joinServer)
      }

      window.eaglercraftXOpts = window.eaglercraftXOpts || opts;

      let container = document.querySelector("#" + window.eaglercraftXOpts.container);
      if (!container) {
        container = document.createElement("div");
        container.id = window.eaglercraftXOpts.container;
        document.body.appendChild(container);
      }
      try { main(); } catch (e) { console.error("Error starting EaglercraftX:", e); }
    });
  </script>
</head>
<body>
  <div id="game_frame"></div>
